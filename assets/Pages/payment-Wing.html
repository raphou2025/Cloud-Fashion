<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order & Payment(Wing)</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="../css/payment.css">

    <!-- Link Logo -->
    <link rel="icon" href="../icon/logo.png">

  </head>
  <body
    style="
      background-image: url(../img/Hero-Banner/2908c37d6cf5270ac6f17c6ac1f2615e.jpg);
    "
  >
    <div class="max-w-4xl mx-auto p-5">
      <a href="#" class="logo-brand">
        <h1 class="content">
          CLOUD WEAR
          <span><i class="fa-brands fa-cotton-bureau"></i></span>
        </h1>
      </a>
      <h1 class="payment">Order & Payment</h1>

      <div class="grid md:grid-cols-2 gap-6">
        <!-- Order Form -->
        <div class="card">
          <h2 class="text-xl font-semibold mb-4">Order Details <img src="../img/Bank/WING.png" alt="" /></h2>
          

          <form id="orderForm" class="space-y-3">
            <div>
              <label class="block text-sm font-medium">Product Name</label>
              <input
                type="text"
                id="productName"
                class="w-full border rounded-lg p-2"
                placeholder="e.g. Fashion T-Shirt"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium">Price ($)</label>
              <input
                type="number"
                id="productPrice"
                class="w-full border rounded-lg p-2"
                placeholder="e.g. 20"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium">Quantity</label>
              <input
                type="number"
                id="quantity"
                class="w-full border rounded-lg p-2"
                value="1"
                min="1"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium">Payment Method</label>
              <select id="paymentMethod" class="w-full border rounded-lg p-2">
                <option value="credit">Credit Card</option>
                <option value="paypal">PayPal</option>
                <option value="cash">Cash on Delivery</option>
              </select>
            </div>
            <button
              type="button"
              onclick="calculateTotal()"
              class="btn w-full mt-3"
            >
              Calculate Total
            </button>
          </form>
        </div>

        <!-- Order Summary -->
        <div class="card">
          <h2 class="text-xl font-semibold mb-4">Order Summary</h2>
          <div id="orderSummary" class="space-y-2">
            <p class="text-black-500">
              Fill the form to see your order summary.
            </p>
          </div>
          <button
            type="button"
            onclick="confirmOrder()"
            class="btn w-full mt-4"
          >
            Confirm Order
          </button>
        </div>
      </div>
    </div>

    <script src="../js/payment.js"></script>
  </body>
</html>
