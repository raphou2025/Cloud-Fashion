<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLOUD WEAR-Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap"
      rel="stylesheet"
    />
     -->

      <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/register.css">
    
    <!-- Link Logo -->
    <link rel="icon" href="../icon/logo.png">
    
  </head>
  <body
    class="bg-white text-black min-h-screen flex items-center justify-center px-4"
    style="
      background-image: url('../img/Hero-Banner/banner-new.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
    "
  >

    <div class="w-full max-w-md space-y-6">
      <!-- Header -->
      <div class="text-center">
        <h1 class="text-brand">CLOUD WEAR <span><i class="fa-brands fa-cotton-bureau"></i></span></h1>
        <p class="text-infor">Create your account</p>
      </div>

      <!-- Register Form -->

      <div class="register-content">
        <form class="space-y-4">
          <div>
            <label class="block text-sm mb-1" for="name">Full Name</label>
            <input
              type="text"
              id="name"
              placeholder="Your name"
              class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black"
            />
          </div>
          <div>
            <label class="block text-sm mb-1" for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black"
            />
          </div>
          <div>
            <label class="block text-sm mb-1" for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Create a password"
              class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black"
            />
          </div>
          <div>
            <label class="block text-sm mb-1" for="confirm"
              >Confirm Password</label
            >
            <input
              type="password"
              id="confirm"
              placeholder="Repeat password"
              class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black"
            />
          </div>
          <a
            href="login.html"
            class="block text-center w-full py-2 bg-black text-white font-medium rounded hover:bg-gray-800 transition"
          >
            Register
          </a>
        </form>

        <!-- Or divider -->
        <div class="flex items-center my-4">
          <div class="flex-grow h-px bg-gray-300"></div>
          <span class="mx-2 text-sm text-gray-500">OR</span>
          <div class="flex-grow h-px bg-gray-300"></div>
        </div>

        <!-- Social Buttons -->
        <div class="space-y-3">
          <button
            class="w-full py-2 border border-gray-300 rounded flex items-center justify-center gap-2 hover:bg-gray-200 transition"
          >
            <img
              src="https://www.svgrepo.com/show/475656/google-color.svg"
              class="w-5 h-5"
              alt="Google"
            />
            <span>Sign up with Google</span>
          </button>
          <button
            class="w-full py-2 border border-gray-300 rounded flex items-center justify-center gap-2 hover:bg-gray-200 transition"
          >
            <img
              src="https://www.svgrepo.com/show/157810/facebook.svg"
              class="w-5 h-5"
              alt="Facebook"
            />
            <span>Sign up with Facebook</span>
          </button>
        </div>

        <!-- Already have an account -->
        <p class="text-login">
          Already have an account?
          <a href="login.html" class="login-link"
            >Log in</a
          >
        </p>
      </div>

      <!-- Footer -->
      <footer class="text-footer">
        © 2025 CLOUD WEAR. All rights reserved.
      </footer>
    </div>
  </body>
</html>
